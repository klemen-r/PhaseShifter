[package]
name = "phaseshifter-backtest"
version = "0.1.0"
edition = "2021"
description = "ML feature extraction and backtesting for PhaseShifter zone interactions"

[dependencies]
# Core PhaseShifter engine
phaseshifter-core = { path = "../BACKEND/phaseshifter-core" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# CLI
clap = { version = "4.0", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# Data output
parquet = { version = "53.0", features = ["snap", "zstd"] }
arrow = { version = "53.0" }
csv = "1.3"

# Parallelism
rayon = "1.10"

# Progress bar
indicatif = "0.17"

# Memory-mapped file reading
memmap2 = "0.9"

# Statistics
statrs = "0.17"

[profile.release]
lto = false
opt-level = 3
